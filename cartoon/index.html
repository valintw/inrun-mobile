<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14121c">
<title>Toon Camera</title>
<style>
  :root {
    --bg: #14121c;
    --panel: #1f1c2b;
    --panel-2: #2a2639;
    --text: #f4f1fa;
    --muted: #a59fb8;
    --accent: #ffcc33;
    --accent-ink: #231a00;
    --danger: #ff6b6b;
    --radius: 16px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; min-height: 100%; }
  header { display: flex; align-items: center; gap: 10px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
  header h1 span { color: var(--accent); }
  header .spacer { flex: 1; }
  main { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-block: 0 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 900px; width: 100%; margin: 0 auto; }

  .stage { position: relative; background: #000; border-radius: var(--radius); overflow: hidden;
    aspect-ratio: 3 / 4; width: 100%; max-height: 62dvh; margin: 0 auto; display: flex; align-items: center; justify-content: center; }
  @media (min-aspect-ratio: 1/1) { .stage { aspect-ratio: 4 / 3; } }
  .stage video, .stage canvas, .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .stage video.mirror { transform: scaleX(-1); }
  #orig { clip-path: inset(0 calc(100% - var(--split, 0%)) 0 0); }
  .split-line { position: absolute; top: 0; bottom: 0; left: var(--split, 0%); width: 2px; background: var(--accent);
    box-shadow: 0 0 6px rgba(0,0,0,.6); pointer-events: none; display: none; }
  .split-line::after { content: "⇆"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: var(--accent); color: var(--accent-ink); width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center; font-weight: 700; font-size: 16px; }
  .stage.comparing .split-line { display: block; }
  #splitRange { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: ew-resize; display: none; }
  .stage.comparing #splitRange { display: block; }

  .drop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(10, 8, 16, .8);
    border: 3px dashed var(--accent); color: var(--text); font-size: 20px; font-weight: 700; pointer-events: none; }
  .badge { position: absolute; top: 10px; left: 10px; background: rgba(10,8,16,.7); color: var(--text); font-size: 12px;
    font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; pointer-events: none; }
  .msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center; padding: 24px; color: var(--muted); }
  .busy { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    background: rgba(10, 8, 16, .55); backdrop-filter: blur(2px); font-weight: 600; }
  .busy.on { display: flex; }
  .spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid rgba(255,255,255,.2); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress { width: 60%; height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }

  .bar { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  button, .btn { appearance: none; border: 0; border-radius: 999px; background: var(--panel-2); color: var(--text);
    font: inherit; font-weight: 600; padding: 11px 18px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    text-decoration: none; min-height: 44px; }
  button:active, .btn:active { transform: scale(.97); }
  button.primary, .btn.primary { background: var(--accent); color: var(--accent-ink); }
  button[disabled] { opacity: .45; pointer-events: none; }
  .shutter { width: 76px; height: 76px; padding: 0; border-radius: 50%; background: #fff; border: 5px solid var(--accent);
    box-shadow: 0 0 0 4px var(--bg) inset; justify-content: center; }
  .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .round { width: 48px; height: 48px; padding: 0; justify-content: center; }
  input[type=file] { display: none; }

  .panel { background: var(--panel); border-radius: var(--radius); padding: 14px; display: none; flex-direction: column; gap: 14px; }
  .panel.on { display: flex; }
  .styles { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .styles::-webkit-scrollbar { display: none; }
  .styles button { flex: 0 0 auto; padding: 8px 14px; min-height: 36px; font-size: 14px; }
  .styles button.on { background: var(--accent); color: var(--accent-ink); }
  .sliders { display: grid; grid-template-columns: 1fr; gap: 10px 20px; }
  @media (min-width: 560px) { .sliders { grid-template-columns: 1fr 1fr; } }
  label.s { display: grid; grid-template-columns: 110px 1fr 34px; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
  label.s output { color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .check { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .check input { accent-color: var(--accent); width: 18px; height: 18px; }
  .seg { display: flex; background: var(--panel-2); border-radius: 999px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; min-height: 36px; padding: 6px 10px; font-size: 14px; background: transparent; }
  .seg button.on { background: var(--text); color: var(--bg); }
  .panel:not(.vector) .vec-only { display: none; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; margin: 0; }
  .err { color: var(--danger); }
</style>
</head>
<body>
<header>
  <h1>Toon<span>Cam</span></h1>
  <div class="spacer"></div>
  <button id="uploadBtn" title="Upload a photo from your device">
    <svg class="icon" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>Upload photo
  </button>
  <input id="fileInput" type="file" accept="image/*">
  <input id="captureInput" type="file" accept="image/*" capture="environment">
</header>

<main>
  <div class="stage" id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="result" hidden></canvas>
    <img id="vec" alt="Cartoon illustration" hidden>
    <canvas id="orig" hidden></canvas>
    <div class="split-line"></div>
    <div class="badge" id="exampleBadge" hidden>Example</div>
    <input id="splitRange" type="range" min="0" max="100" value="0" aria-label="Compare with original">
    <div class="msg" id="msg">
      <div class="spinner"></div>
      <div>Starting camera…</div>
    </div>
    <div class="busy" id="busy">
      <div class="spinner"></div>
      <div id="busyText">Drawing your cartoon…</div>
      <div class="progress"><i id="progress"></i></div>
    </div>
  </div>

  <!-- camera controls -->
  <div class="drop" id="drop" hidden>Drop your photo to cartoonify it</div>
  <div class="bar" id="camBar">
    <button id="flipBtn" class="round" title="Switch camera" aria-label="Switch camera">
      <svg class="icon" viewBox="0 0 24 24"><path d="M20 7h-3l-2-3H9L7 7H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/><path d="M9 13a3 3 0 0 1 5.2-2"/><path d="M15 13a3 3 0 0 1-5.2 2"/><path d="M14 9v2h2M10 17v-2H8"/></svg>
    </button>
    <button id="shutter" class="shutter" title="Take picture" aria-label="Take picture" disabled></button>
    <button id="timerBtn" class="round" title="3-second timer" aria-label="3-second timer">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>
    </button>
  </div>

  <!-- result controls -->
  <div class="bar" id="resBar" hidden>
    <button id="retakeBtn">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span id="retakeLabel">Retake</span>
    </button>
    <button id="compareBtn">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v18M8 7H4v10h4M16 7h4v10h-4"/></svg>Compare
    </button>
    <button id="saveBtn" class="primary">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Save PNG
    </button>
    <button id="saveSvgBtn" class="primary" hidden>
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Save SVG
    </button>
  </div>

  <div class="panel vector" id="panel">
    <div class="seg" role="group" aria-label="Drawing mode">
      <button id="modeVec" class="on">Vector shapes (SVG)</button>
      <button id="modePix">Painted pixels</button>
    </div>
    <div class="styles" id="styles"></div>
    <div class="sliders">
      <label class="s">Colours <input type="range" id="colors" min="3" max="20" step="1"><output></output></label>
      <label class="s">Smoothing <input type="range" id="smooth" min="0" max="6" step="1"><output></output></label>
      <label class="s">Line weight <input type="range" id="lineWeight" min="0" max="4" step="1"><output></output></label>
      <label class="s">Line detail <input type="range" id="lineDetail" min="0" max="10" step="1"><output></output></label>
      <label class="s">Saturation <input type="range" id="saturation" min="0" max="200" step="5"><output></output></label>
      <label class="s">Brightness <input type="range" id="brightness" min="-40" max="40" step="2"><output></output></label>
      <label class="s vec-only">Shape size <input type="range" id="regionSize" min="0" max="10" step="1"><output></output></label>
      <label class="s vec-only">Curviness <input type="range" id="curves" min="0" max="10" step="1"><output></output></label>
      <label class="s vec-only">Outlines <input type="range" id="outline" min="0" max="5" step="1"><output></output></label>
    </div>
    <div class="bar" style="justify-content:flex-start">
      <label class="check"><input type="checkbox" id="halftone"> Comic halftone dots</label>
      <label class="check"><input type="checkbox" id="hires"> High resolution</label>
    </div>
  </div>

  <p class="hint" id="hint">Point the camera at something and tap the shutter. Or tap Upload photo, or drag a picture onto the page.</p>
</main>

<!-- ================= Image-processing worker ================= -->
<script id="workerSrc" type="text/js-worker">
'use strict';

// Separable Gaussian blur on a single Float32 channel.
function gaussKernel(sigma) {
  const r = Math.max(1, Math.ceil(sigma * 3));
  const k = new Float32Array(r * 2 + 1);
  let sum = 0;
  for (let i = -r; i <= r; i++) { const v = Math.exp(-(i * i) / (2 * sigma * sigma)); k[i + r] = v; sum += v; }
  for (let i = 0; i < k.length; i++) k[i] /= sum;
  return { k, r };
}
function blur(src, w, h, sigma) {
  const { k, r } = gaussKernel(sigma);
  const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    const row = y * w;
    for (let x = 0; x < w; x++) {
      let s = 0;
      for (let i = -r; i <= r; i++) {
        let xx = x + i; if (xx < 0) xx = 0; else if (xx >= w) xx = w - 1;
        s += src[row + xx] * k[i + r];
      }
      tmp[row + x] = s;
    }
  }
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let s = 0;
      for (let i = -r; i <= r; i++) {
        let yy = y + i; if (yy < 0) yy = 0; else if (yy >= h) yy = h - 1;
        s += tmp[yy * w + x] * k[i + r];
      }
      out[y * w + x] = s;
    }
  }
  return out;
}

// Edge-preserving bilateral filter (one pass) on R,G,B float channels.
function bilateral(R, G, B, w, h, radius, sigmaS, sigmaR) {
  const n = w * h;
  const oR = new Float32Array(n), oG = new Float32Array(n), oB = new Float32Array(n);
  const size = radius * 2 + 1;
  const spatial = new Float32Array(size * size);
  for (let dy = -radius; dy <= radius; dy++)
    for (let dx = -radius; dx <= radius; dx++)
      spatial[(dy + radius) * size + dx + radius] = Math.exp(-(dx * dx + dy * dy) / (2 * sigmaS * sigmaS));
  // Range-weight lookup table indexed by squared colour distance / 4.
  const LUT_N = 48769; // 3*255^2/4 + 1
  const rangeLut = new Float32Array(LUT_N);
  for (let i = 0; i < LUT_N; i++) rangeLut[i] = Math.exp(-(i * 4) / (2 * sigmaR * sigmaR));

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const c = y * w + x;
      const r0 = R[c], g0 = G[c], b0 = B[c];
      let sr = 0, sg = 0, sb = 0, sw = 0;
      for (let dy = -radius; dy <= radius; dy++) {
        let yy = y + dy; if (yy < 0) yy = 0; else if (yy >= h) yy = h - 1;
        const row = yy * w, srow = (dy + radius) * size + radius;
        for (let dx = -radius; dx <= radius; dx++) {
          let xx = x + dx; if (xx < 0) xx = 0; else if (xx >= w) xx = w - 1;
          const p = row + xx;
          const dr = R[p] - r0, dg = G[p] - g0, db = B[p] - b0;
          let d = ((dr * dr + dg * dg + db * db) / 4) | 0;
          if (d >= LUT_N) d = LUT_N - 1;
          const wt = spatial[srow + dx] * rangeLut[d];
          sr += R[p] * wt; sg += G[p] * wt; sb += B[p] * wt; sw += wt;
        }
      }
      oR[c] = sr / sw; oG[c] = sg / sw; oB[c] = sb / sw;
    }
  }
  return [oR, oG, oB];
}

// sRGB <-> CIE Lab so colour clustering matches how people see colour.
function srgbToLin(v) { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
function linToSrgb(v) { v = v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055; return Math.max(0, Math.min(255, v * 255)); }
const LIN = new Float32Array(256); for (let i = 0; i < 256; i++) LIN[i] = srgbToLin(i);
function fLab(t) { return t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116; }
function rgbToLab(r, g, b) {
  const lr = LIN[Math.max(0, Math.min(255, r | 0))], lg = LIN[Math.max(0, Math.min(255, g | 0))], lb = LIN[Math.max(0, Math.min(255, b | 0))];
  const X = (lr * 0.4124 + lg * 0.3576 + lb * 0.1805) / 0.95047;
  const Y = (lr * 0.2126 + lg * 0.7152 + lb * 0.0722);
  const Z = (lr * 0.0193 + lg * 0.1192 + lb * 0.9505) / 1.08883;
  const fx = fLab(X), fy = fLab(Y), fz = fLab(Z);
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
}
function labToRgb(L, a, b) {
  const fy = (L + 16) / 116, fx = fy + a / 500, fz = fy - b / 200;
  const inv = t => { const t3 = t * t * t; return t3 > 0.008856 ? t3 : (t - 16 / 116) / 7.787; };
  const X = inv(fx) * 0.95047, Y = inv(fy), Z = inv(fz) * 1.08883;
  const lr = X * 3.2406 + Y * -1.5372 + Z * -0.4986;
  const lg = X * -0.9689 + Y * 1.8758 + Z * 0.0415;
  const lb = X * 0.0557 + Y * -0.2040 + Z * 1.0570;
  return [linToSrgb(lr), linToSrgb(lg), linToSrgb(lb)];
}

// k-means++ in Lab space on a random sample of pixels.
function kmeans(L, A, Bc, n, k) {
  const SAMPLE = Math.min(n, 24000);
  const idx = new Uint32Array(SAMPLE);
  let seed = 1234567;
  const rand = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  for (let i = 0; i < SAMPLE; i++) idx[i] = Math.floor(rand() * n);
  const sL = new Float32Array(SAMPLE), sA = new Float32Array(SAMPLE), sB = new Float32Array(SAMPLE);
  for (let i = 0; i < SAMPLE; i++) { const p = idx[i]; sL[i] = L[p]; sA[i] = A[p]; sB[i] = Bc[p]; }

  const cL = new Float32Array(k), cA = new Float32Array(k), cB = new Float32Array(k);
  const dist = new Float32Array(SAMPLE).fill(Infinity);
  let first = Math.floor(rand() * SAMPLE);
  cL[0] = sL[first]; cA[0] = sA[first]; cB[0] = sB[first];
  for (let c = 1; c < k; c++) {
    let total = 0;
    for (let i = 0; i < SAMPLE; i++) {
      const dl = sL[i] - cL[c - 1], da = sA[i] - cA[c - 1], db = sB[i] - cB[c - 1];
      const d = dl * dl + da * da + db * db;
      if (d < dist[i]) dist[i] = d;
      total += dist[i];
    }
    let target = rand() * total, pick = SAMPLE - 1;
    for (let i = 0; i < SAMPLE; i++) { target -= dist[i]; if (target <= 0) { pick = i; break; } }
    cL[c] = sL[pick]; cA[c] = sA[pick]; cB[c] = sB[pick];
  }
  const assign = new Uint8Array(SAMPLE);
  for (let iter = 0; iter < 14; iter++) {
    const sumL = new Float64Array(k), sumA = new Float64Array(k), sumB = new Float64Array(k), cnt = new Uint32Array(k);
    for (let i = 0; i < SAMPLE; i++) {
      let best = 0, bd = Infinity;
      for (let c = 0; c < k; c++) {
        const dl = sL[i] - cL[c], da = sA[i] - cA[c], db = sB[i] - cB[c];
        const d = dl * dl + da * da + db * db;
        if (d < bd) { bd = d; best = c; }
      }
      assign[i] = best; sumL[best] += sL[i]; sumA[best] += sA[i]; sumB[best] += sB[i]; cnt[best]++;
    }
    for (let c = 0; c < k; c++) if (cnt[c]) { cL[c] = sumL[c] / cnt[c]; cA[c] = sumA[c] / cnt[c]; cB[c] = sumB[c] / cnt[c]; }
  }
  return { cL, cA, cB };
}

function process(img, w, h, p) {
  const n = w * h;
  const src = img.data;
  const scale = Math.max(w, h) / 800; // keep effects proportionate to image size
  const step = (frac) => postMessage({ type: 'progress', value: frac });

  let R = new Float32Array(n), G = new Float32Array(n), B = new Float32Array(n);
  for (let i = 0, j = 0; i < n; i++, j += 4) { R[i] = src[j]; G[i] = src[j + 1]; B[i] = src[j + 2]; }
  step(0.05);

  // 1. Smooth away texture while keeping edges sharp.
  const radius = Math.max(2, Math.round(2.5 * scale));
  for (let pass = 0; pass < p.smooth; pass++) {
    [R, G, B] = bilateral(R, G, B, w, h, radius, radius * 0.75, 22 + pass * 4);
    step(0.05 + 0.45 * (pass + 1) / Math.max(1, p.smooth));
  }

  // 2. Lines: difference-of-Gaussians on luminance (XDoG-style threshold).
  const gray = new Float32Array(n);
  for (let i = 0; i < n; i++) gray[i] = 0.299 * R[i] + 0.587 * G[i] + 0.114 * B[i];
  let ink = new Float32Array(n);
  if (p.lineWeight > 0) {
    const s1 = 0.9 * scale + 0.3;
    const g1 = blur(gray, w, h, s1), g2 = blur(gray, w, h, s1 * 1.6);
    // Higher detail => lower threshold => more lines.
    const thr = 1.2 + (10 - p.lineDetail) * 0.9;
    for (let i = 0; i < n; i++) {
      const d = g2[i] - g1[i]; // positive on the dark side of an edge
      ink[i] = d > thr ? Math.min(1, (d - thr) / 2.5) : 0;
    }
    // Thicken lines (max filter), then soften for anti-aliasing.
    const dil = Math.round((p.lineWeight - 1) * Math.max(1, scale));
    for (let pass = 0; pass < dil; pass++) {
      const out = new Float32Array(n);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const c = y * w + x; let m = ink[c];
        if (x > 0 && ink[c - 1] > m) m = ink[c - 1];
        if (x < w - 1 && ink[c + 1] > m) m = ink[c + 1];
        if (y > 0 && ink[c - w] > m) m = ink[c - w];
        if (y < h - 1 && ink[c + w] > m) m = ink[c + w];
        out[c] = m;
      }
      ink = out;
    }
    ink = blur(ink, w, h, 0.6 * Math.max(1, scale));
    // Remove tiny specks: drop faint isolated ink.
    for (let i = 0; i < n; i++) ink[i] = ink[i] < 0.12 ? 0 : Math.min(1, ink[i] * 1.25);
  }
  step(0.62);

  // 3. Flat colour: cluster in Lab space, then posterise every pixel to its cluster.
  const L = new Float32Array(n), A = new Float32Array(n), Bc = new Float32Array(n);
  for (let i = 0; i < n; i++) { const lab = rgbToLab(R[i], G[i], B[i]); L[i] = lab[0]; A[i] = lab[1]; Bc[i] = lab[2]; }
  const k = p.colors;
  const { cL, cA, cB } = kmeans(L, A, Bc, n, k);
  step(0.75);

  // Cartoon palette: punchier chroma, adjustable brightness, gentle lift of shadows.
  const pal = new Uint8ClampedArray(k * 3);
  const satMul = p.saturation / 100;
  for (let c = 0; c < k; c++) {
    let Lv = cL[c];
    Lv = 100 * Math.pow(Math.max(0, Lv) / 100, 0.9) + p.brightness * 0.5; // lift mids slightly
    Lv = Math.max(0, Math.min(100, Lv));
    const rgb = labToRgb(Lv, cA[c] * satMul, cB[c] * satMul);
    pal[c * 3] = rgb[0]; pal[c * 3 + 1] = rgb[1]; pal[c * 3 + 2] = rgb[2];
  }

  let label = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    let best = 0, bd = Infinity;
    const l = L[i], a = A[i], b = Bc[i];
    for (let c = 0; c < k; c++) {
      const dl = l - cL[c], da = a - cA[c], db = b - cB[c];
      const d = dl * dl + da * da + db * db;
      if (d < bd) { bd = d; best = c; }
    }
    label[i] = best;
  }
  step(0.85);

  // 4. Majority (mode) filter to clean up speckled regions.
  const modePasses = 2;
  const counts = new Uint16Array(k);
  for (let pass = 0; pass < modePasses; pass++) {
    const out = new Uint8Array(n);
    const r = Math.max(1, Math.round(scale));
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      counts.fill(0);
      for (let dy = -r; dy <= r; dy++) {
        const yy = Math.min(h - 1, Math.max(0, y + dy));
        for (let dx = -r; dx <= r; dx++) {
          const xx = Math.min(w - 1, Math.max(0, x + dx));
          counts[label[yy * w + xx]]++;

  }
  step(0.9);

  if (p.vector) return { svg: buildSvg(label, pal, k, ink, w, h, p, scale) };

  // 5. Composite: flat colour + optional halftone shading + ink.
  const out = new Uint8ClampedArray(n * 4);
  const INK_R = 22, INK_G = 18, INK_B = 30;
  const cell = Math.max(4, Math.round(5 * scale));
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x, j = i * 4, c = label[i];
    let r = pal[c * 3], g = pal[c * 3 + 1], b = pal[c * 3 + 2];
    if (p.halftone) {
      // Dot size grows as the region gets darker (classic comic print look).
      const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      const cx = (x % cell) - cell / 2 + 0.5, cy = ((y + (Math.floor(x / cell) % 2) * cell / 2) % cell) - cell / 2 + 0.5;
      const dotR = (1 - lum) * cell * 0.55;
      const dd = Math.sqrt(cx * cx + cy * cy);
      const cover = Math.max(0, Math.min(1, dotR - dd + 0.5));
      const f = 1 - 0.35 * cover;
      r *= f; g *= f; b *= f;
    }
    const a = ink[i];
    out[j] = r * (1 - a) + INK_R * a;
    out[j + 1] = g * (1 - a) + INK_G * a;
    out[j + 2] = b * (1 - a) + INK_B * a;
    out[j + 3] = 255;
  }
  step(1);
  return out;
}

// ---------------- Vector (SVG) pipeline ----------------

// Merge connected regions smaller than minArea into their most common neighbouring colour.
function mergeSmall(label, w, h, k, minArea) {
  const n = w * h, comp = new Int32Array(n), order = new Int32Array(n), nb = new Uint32Array(k);
  for (let pass = 0; pass < 3; pass++) {
    comp.fill(-1);
    let qEnd = 0, changed = 0;
    for (let s = 0; s < n; s++) {
      if (comp[s] !== -1) continue;
      const L = label[s], start = qEnd;
      order[qEnd++] = s; comp[s] = start;
      let head = start;
      while (head < qEnd) {
        const c = order[head++], x = c % w;
        if (x > 0 && comp[c - 1] === -1 && label[c - 1] === L) { comp[c - 1] = start; order[qEnd++] = c - 1; }
        if (x < w - 1 && comp[c + 1] === -1 && label[c + 1] === L) { comp[c + 1] = start; order[qEnd++] = c + 1; }
        if (c >= w && comp[c - w] === -1 && label[c - w] === L) { comp[c - w] = start; order[qEnd++] = c - w; }
        if (c < n - w && comp[c + w] === -1 && label[c + w] === L) { comp[c + w] = start; order[qEnd++] = c + w; }
      }
      if (qEnd - start >= minArea) continue;
      nb.fill(0);
      for (let i = start; i < qEnd; i++) {
        const c = order[i], x = c % w;
        if (x > 0 && label[c - 1] !== L) nb[label[c - 1]]++;
        if (x < w - 1 && label[c + 1] !== L) nb[label[c + 1]]++;
        if (c >= w && label[c - w] !== L) nb[label[c - w]]++;
        if (c < n - w && label[c + w] !== L) nb[label[c + w]]++;
      }
      let best = -1, bc = 0;
      for (let c = 0; c < k; c++) if (nb[c] > bc) { bc = nb[c]; best = c; }
      if (best < 0) continue;
      for (let i = start; i < qEnd; i++) label[order[i]] = best;
      changed++;
    }
    if (!changed) break;
  }
}

// Trace the pixel-edge outline of every region. Loops run clockwise around their region
// (positive area); holes run anticlockwise (negative area). Returns corner points only.
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];
function traceLoops(lab, w, h, only) {
  const W1 = w + 1;
  const eKey = [], eDir = [], eLab = [];
  const head = new Map(); const next = [];
  const add = (vx, vy, d, L) => {
    const id = eKey.length, key = vy * W1 + vx;
    eKey.push(key); eDir.push(d); eLab.push(L);
    const hk = key * 256 + L;
    const prev = head.get(hk);
    next.push(prev === undefined ? -1 : prev);
    head.set(hk, id);
  };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const c = y * w + x, L = lab[c];
    if (only !== undefined && L !== only) continue;
    if (y === 0 || lab[c - w] !== L) add(x, y, 0, L);
    if (x === w - 1 || lab[c + 1] !== L) add(x + 1, y, 1, L);
    if (y === h - 1 || lab[c + w] !== L) add(x + 1, y + 1, 2, L);
    if (x === 0 || lab[c - 1] !== L) add(x, y + 1, 3, L);
  }
  const used = new Uint8Array(eKey.length);
  const loops = [];
  for (let e0 = 0; e0 < eKey.length; e0++) {
    if (used[e0]) continue;
    const L = eLab[e0], startKey = eKey[e0];
    const xs = [], ys = [];
    let e = e0, prevDir = -1, area = 0;
    for (;;) {
      used[e] = 1;
      const d = eDir[e], k0 = eKey[e];
      const vx = k0 % W1, vy = (k0 / W1) | 0;
      if (d !== prevDir) { xs.push(vx); ys.push(vy); }
      const ex = vx + DX[d], ey = vy + DY[d];
      area += vx * ey - ex * vy;
      prevDir = d;
      const endKey = ey * W1 + ex;
      if (endKey === startKey) break;
      // Pick the next edge from this vertex; at a saddle prefer turning right (keeps regions 4-connected).
      let cand = head.get(endKey * 256 + L), pick = -1;
      while (cand !== undefined && cand !== -1) {
        if (!used[cand]) { if (pick === -1 || eDir[cand] === (d + 1) % 4) pick = cand; }
        cand = next[cand];
      }
      if (pick === -1) break;
      e = pick;
    }
    if (xs.length >= 3) loops.push({ label: L, xs, ys, area: area / 2 });
  }
  return loops;
}

// Douglas-Peucker simplification of a closed polygon.
function simplifyClosed(xs, ys, tol) {
  const n = xs.length;
  if (n <= 4 || tol <= 0) return [xs, ys];
  let far = 0, fd = -1;
  for (let i = 1; i < n; i++) { const d = (xs[i] - xs[0]) ** 2 + (ys[i] - ys[0]) ** 2; if (d > fd) { fd = d; far = i; } }
  const keep = new Uint8Array(n); keep[0] = 1; keep[far] = 1;
  const t2 = tol * tol;
  const stack = [[0, far], [far, n]];
  while (stack.length) {
    const [a, b] = stack.pop();
    const bx = xs[b % n], by = ys[b % n], ax = xs[a], ay = ys[a];
    const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy || 1e-9;
    let mi = -1, md = t2;
    for (let i = a + 1; i < b; i++) {
      const cr = (xs[i] - ax) * dy - (ys[i] - ay) * dx;
      const d = cr * cr / len2;
      if (d > md) { md = d; mi = i; }
    }
    if (mi !== -1) { keep[mi] = 1; stack.push([a, mi], [mi, b]); }
  }
  const ox = [], oy = [];
  for (let i = 0; i < n; i++) if (keep[i]) { ox.push(xs[i]); oy.push(ys[i]); }
  return [ox, oy];
}

// Closed Catmull-Rom spline as cubic Beziers; sharp corners (and the image frame) stay crisp.
const r1 = (v) => Math.round(v * 10) / 10;
function smoothPath(xs, ys, w, h) {
  const n = xs.length;
  if (n < 3) return '';
  const tx = new Float32Array(n), ty = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const a = (i - 1 + n) % n, b = (i + 1) % n;
    const v1x = xs[i] - xs[a], v1y = ys[i] - ys[a], v2x = xs[b] - xs[i], v2y = ys[b] - ys[i];
    const l1 = Math.hypot(v1x, v1y) || 1, l2 = Math.hypot(v2x, v2y) || 1;
    const cos = (v1x * v2x + v1y * v2y) / (l1 * l2);
    const onFrame = xs[i] <= 0 || ys[i] <= 0 || xs[i] >= w || ys[i] >= h;
    if (cos < 0.15 || onFrame) continue; // corner sharper than ~80 degrees: keep it pointed
    const s = Math.min(l1, l2) / (l1 + l2); // limit tangent length so curves never overshoot
    tx[i] = (xs[b] - xs[a]) * s * 0.5; ty[i] = (ys[b] - ys[a]) * s * 0.5;
  }
  let d = 'M' + r1(xs[0]) + ' ' + r1(ys[0]);
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    d += 'C' + r1(xs[i] + tx[i] * 0.66) + ' ' + r1(ys[i] + ty[i] * 0.66) + ' ' +
      r1(xs[j] - tx[j] * 0.66) + ' ' + r1(ys[j] - ty[j] * 0.66) + ' ' + r1(xs[j]) + ' ' + r1(ys[j]);
  }
  return d + 'Z';
}

const hex = (r, g, b) => '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);

function buildSvg(label, pal, k, ink, w, h, p, scale) {
  const step = (frac) => postMessage({ type: 'progress', value: frac });
  const minArea = Math.max(4, Math.round((6 + p.regionSize * p.regionSize * 9) * scale * scale));
  mergeSmall(label, w, h, k, minArea);
  step(0.93);

  const tol = (0.5 + p.curves * 0.22) * Math.max(1, scale);
  const loops = traceLoops(label, w, h).filter(l => l.area > 0); // outer outlines only: painted big-to-small
  loops.sort((a, b) => b.area - a.area);
  step(0.96);

  const areaBy = new Float64Array(k);
  for (const l of loops) areaBy[l.label] += l.area;
  let bg = 0; for (let c = 1; c < k; c++) if (areaBy[c] > areaBy[bg]) bg = c;
  const col = (c) => hex(pal[c * 3], pal[c * 3 + 1], pal[c * 3 + 2]);
  const lum = (c) => (0.299 * pal[c * 3] + 0.587 * pal[c * 3 + 1] + 0.114 * pal[c * 3 + 2]) / 255;
  const INK = '#16121e';

  const parts = [];
  const cell = Math.max(5, Math.round(6 * scale));
  parts.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '">');
  if (p.halftone) {
    parts.push('<defs>');
    for (let lv = 1; lv <= 3; lv++) {
      parts.push('<pattern id="ht' + lv + '" width="' + cell + '" height="' + cell + '" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
        '<circle cx="' + cell / 2 + '" cy="' + cell / 2 + '" r="' + r1(cell * (0.14 + lv * 0.1)) + '" fill="#000" fill-opacity="0.28"/></pattern>');
    }
    parts.push('</defs>');
  }
  parts.push('<rect width="' + w + '" height="' + h + '" fill="' + col(bg) + '"/>');
  parts.push('<g stroke-linejoin="round" stroke-width="' + r1(1.2 * Math.max(1, scale)) + '">');
  let outlineD = '', shapes = 0;
  for (const l of loops) {
    const [sx, sy] = simplifyClosed(l.xs, l.ys, tol);
    const d = smoothPath(sx, sy, w, h);
    if (!d) continue;
    const c = col(l.label);
    parts.push('<path d="' + d + '" fill="' + c + '" stroke="' + c + '"/>');
    if (p.halftone) {
      const L = lum(l.label);
      if (L < 0.8) parts.push('<path d="' + d + '" fill="url(#ht' + (L < 0.35 ? 3 : L < 0.6 ? 2 : 1) + ')"/>');
    }
    if (p.outline > 0 && l.area < w * h * 0.97) outlineD += d;
    shapes++;
  }
  parts.push('</g>');
  if (p.outline > 0 && outlineD) {
    parts.push('<path d="' + outlineD + '" fill="none" stroke="' + INK + '" stroke-width="' + r1(p.outline * 0.9 * Math.max(1, scale)) +
      '" stroke-linejoin="round" stroke-linecap="round"/>');
  }
  // Detail ink lines (eyes, folds, edges inside a colour region), traced as filled shapes with holes.
  if (p.lineWeight > 0) {
    const mask = new Uint8Array(w * h);
    for (let i = 0; i < mask.length; i++) mask[i] = ink[i] > 0.45 ? 1 : 0;
    mergeSmall(mask, w, h, 2, Math.max(3, Math.round(8 * scale * scale)));
    const inkLoops = traceLoops(mask, w, h, 1);
    let inkD = '';
    for (const l of inkLoops) {
      if (Math.abs(l.area) < 3 * scale * scale) continue;
      const [sx, sy] = simplifyClosed(l.xs, l.ys, 0.45 * Math.max(1, scale));
      inkD += smoothPath(sx, sy, w, h);
    }
    if (inkD) parts.push('<path d="' + inkD + '" fill="' + INK + '"/>');
  }
  parts.push('</svg>');
  step(1);
  return { text: parts.join(''), shapes };
}

self.onmessage = (e) => {
  const { id, data, w, h, params } = e.data;
  try {
    const out = process({ data }, w, h, params);
    if (out.svg) postMessage({ type: 'done', id, svg: out.svg.text, shapes: out.svg.shapes, w, h });
    else postMessage({ type: 'done', id, data: out, w, h }, [out.buffer]);
  } catch (err) {
    postMessage({ type: 'error', id, message: String(err && err.message || err) });
  }
};

<script>

  flash();
  useSource(c);
}
function flash() {
  const f = document.createElement('div');
  f.style.cssText = 'position:absolute;inset:0;background:#fff;opacity:.9;transition:opacity .35s;pointer-events:none';
  stage.appendChild(f);
  requestAnimationFrame(() => requestAnimationFrame(() => { f.style.opacity = 0; }));
  setTimeout(() => f.remove(), 400);
}
function useSource(canvas, isExample) {
  sourceCanvas = canvas;
  $('exampleBadge').hidden = !isExample;
  stopCamera();
  video.hidden = true; msg.hidden = true;
  $('camBar').hidden = true; $('resBar').hidden = false;
  $('panel').classList.add('on');
  $('hint').textContent = isExample
    ? 'This is an example. Tap Take photo to use your camera, or Upload photo to use a picture you already have.'
    : 'Pick a style or tweak the sliders. Tap Compare to see the original.';
  const ar = canvas.width / canvas.height;
  stage.style.aspectRatio = ar.toFixed(4);
  render();
}

function render() {
  if (!sourceCanvas) return;
  if (pendingJob) { queued = true; return; }
  const maxSide = $('hires').checked ? 1600 : 900;
  const s = Math.min(1, maxSide / Math.max(sourceCanvas.width, sourceCanvas.height));
  const w = Math.round(sourceCanvas.width * s), h = Math.round(sourceCanvas.height * s);
  origCv.width = w; origCv.height = h;
  const octx = origCv.getContext('2d', { willReadFrequently: true });
  octx.imageSmoothingQuality = 'high';
  octx.drawImage(sourceCanvas, 0, 0, w, h);
  origCv.hidden = false;
  const img = octx.getImageData(0, 0, w, h);
  pendingJob = true;
  progress.style.width = '0%';
  busy.classList.add('on');
  $('saveBtn').disabled = true; $('saveSvgBtn').disabled = true;
  worker.postMessage({ id: ++jobId, data: img.data, w, h, params: { ...params, vector: vectorMode } }, [img.data.buffer]);
}

function retake() {
  if (!camAvailable) { $('captureInput').click(); return; }
  sourceCanvas = null;
  resultCv.hidden = true; origCv.hidden = true; $('vec').hidden = true; video.hidden = false;
  stage.style.aspectRatio = '';
  setCompare(false);
  $('camBar').hidden = false; $('resBar').hidden = true;
  $('panel').classList.remove('on');
  $('hint').textContent = 'Point the camera at something and tap the shutter. Or tap Upload photo, or drag a picture onto the page.';
  startCamera();
}

// ---------- compare ----------
function setCompare(on) {
  stage.classList.toggle('comparing', on);
  const v = on ? 50 : 0;
  $('splitRange').value = v;
  stage.style.setProperty('--split', v + '%');
  $('compareBtn').classList.toggle('primary', on);
}
$('compareBtn').onclick = () => setCompare(!stage.classList.contains('comparing'));
$('splitRange').oninput = (e) => stage.style.setProperty('--split', e.target.value + '%');

// ---------- save ----------
// Inside a claude.ai artifact, plain download links are blocked; use the viewer's downloads capability when present.
let downloadsApi = null;
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('downloads').then(d => { downloadsApi = d; }).catch(() => {});
}
async function saveBlob(blob, ext, type) {
  const name = 'toon-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.' + ext;
  if (downloadsApi) {
    try { await downloadsApi.save({ filename: name, data: blob }); }
    catch (e) { if (e && e.code !== 'declined') $('hint').textContent = 'Saving is not available in this view.'; }
    return;
  }
  const file = new File([blob], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] }) && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
    try { await navigator.share({ files: [file], title: 'My cartoon' }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$('saveBtn').onclick = () => resultCv.toBlob((blob) => saveBlob(blob, 'png', 'image/png'), 'image/png');
$('saveSvgBtn').onclick = () => saveBlob(new Blob([svgText], { type: 'image/svg+xml' }), 'svg', 'image/svg+xml');

// ---------- upload ----------
$('uploadBtn').onclick = () => $('fileInput').click();
async function onPicked(e) {
  const file = e.target.files[0]; e.target.value = '';
  loadFile(file);
}
async function loadFile(file) {
  if (!file) return;
  if (file.type && !file.type.startsWith('image/')) {
    $('hint').innerHTML = '<span class="err">That file is not an image. Choose a JPEG, PNG, WebP or HEIC photo.</span>';
    return;
  }
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => createImageBitmap(file));
    const c = document.createElement('canvas');
    c.width = bmp.width; c.height = bmp.height;
    c.getContext('2d').drawImage(bmp, 0, 0);
    setCompare(false);
    useSource(c);
  } catch (err) {
    $('hint').innerHTML = '<span class="err">Could not open that image. Try a JPEG or PNG photo.</span>';
  }
}
$('fileInput').onchange = onPicked;
// Drag and drop a picture anywhere on the page.
let dragDepth = 0;
const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
document.addEventListener('dragenter', (e) => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; $('drop').hidden = false; });
document.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('drop').hidden = true; } });
document.addEventListener('drop', (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; $('drop').hidden = true;
  const f = Array.from(e.dataTransfer.files).find(f => f.type.startsWith('image/')) || e.dataTransfer.files[0];
  loadFile(f);
});
// Paste an image from the clipboard (Ctrl/Cmd+V).
document.addEventListener('paste', (e) => {
  const item = Array.from((e.clipboardData && e.clipboardData.items) || []).find(i => i.type.startsWith('image/'));
  if (item) { e.preventDefault(); loadFile(item.getAsFile()); }
});
$('captureInput').onchange = onPicked;

// ---------- controls ----------
$('shutter').onclick = capture;
$('flipBtn').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; startCamera(); };
$('retakeBtn').onclick = retake;
$('timerBtn').onclick = () => {
  if (!stream) return;
  let n = 3;
  const t = document.createElement('div');
  t.style.cssText = 'position:absolute;inset:0;display:grid;place-items:center;font-size:110px;font-weight:800;color:#fff;text-shadow:0 4px 20px #000;pointer-events:none';
  stage.appendChild(t);
  const tick = () => {
    if (n === 0) { t.remove(); capture(); return; }
    t.textContent = n--; setTimeout(tick, 1000);
  };
  tick();
};

const stylesEl = $('styles');
for (const name of Object.keys(STYLES)) {
  const b = document.createElement('button');
  b.textContent = name; b.dataset.style = name;
  b.onclick = () => applyStyle(name);
  stylesEl.appendChild(b);
}
function syncControls() {
  for (const id of SLIDERS) {
    const el = $(id); el.value = params[id];
    el.nextElementSibling.textContent = id === 'saturation' ? params[id] + '%' : params[id];
  }
  $('halftone').checked = params.halftone;
  for (const b of stylesEl.children) b.classList.toggle('on', b.dataset.style === currentStyle);
}
function applyStyle(name) {
  currentStyle = name; params = { ...STYLES[name] };
  syncControls(); render();
}
let debounce;
for (const id of SLIDERS) {
  $(id).addEventListener('input', (e) => {
    params[id] = +e.target.value;
    e.target.nextElementSibling.textContent = id === 'saturation' ? params[id] + '%' : params[id];
    currentStyle = null; syncControls();
    clearTimeout(debounce); debounce = setTimeout(render, 250);
  });
}
$('halftone').onchange = (e) => { params.halftone = e.target.checked; currentStyle = null; syncControls(); render(); };
$('hires').onchange = render;
function setMode(vec) {
  vectorMode = vec;
  $('modeVec').classList.toggle('on', vec); $('modePix').classList.toggle('on', !vec);
  $('panel').classList.toggle('vector', vec);
  render();
}
$('modeVec').onclick = () => setMode(true);
$('modePix').onclick = () => setMode(false);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopCamera();
  else if (!sourceCanvas) startCamera();
});

syncControls();
startCamera();
</script>
</body>
</html>
